# Одни и те же версии локально и в CI: стейт, записанный новой версией
# terraform, старая прочитать не сможет
[tools]
terraform  = "1.15.8"
terragrunt = "1.1.6"

[env]
TG_NON_INTERACTIVE = "true"

# Локальный запуск — через impersonation, с теми же правами, что у CI.
# В CI эти задачи не используются: там SA выдаёт google-github-actions/auth

[tasks.plan]
description = "terragrunt plan по всем стекам от имени terraform-plan"
env = { GOOGLE_IMPERSONATE_SERVICE_ACCOUNT = "terraform-plan@gcp-learning-bohdan88.iam.gserviceaccount.com" }
run = "terragrunt run --all plan"

[tasks.apply]
description = "terragrunt apply по всем стекам от имени terraform-apply"
env = { GOOGLE_IMPERSONATE_SERVICE_ACCOUNT = "terraform-apply@gcp-learning-bohdan88.iam.gserviceaccount.com" }
run = "terragrunt run --all apply"

[tasks.format]
description = "Форматирование HCL и terraform"
run = "terragrunt hcl format && terraform fmt -recursive databases"
