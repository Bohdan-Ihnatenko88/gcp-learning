# Same versions locally and in CI: state written by a newer terraform
# cannot be read by an older one
[tools]
terraform  = "1.17.2"
terragrunt = "1.2.3"
tflint     = "0.66.0"
trivy      = "0.76.2"

[env]
TG_NON_INTERACTIVE = "true"
# Separate gcloud config dir (accounts, ADC) for this repo, so signing in here
# does not overwrite credentials of other projects. Active when mise is
# activated in the shell or via `mise run` / `mise exec`. In CI it is unused:
# google-github-actions/auth sets GOOGLE_APPLICATION_CREDENTIALS, which wins.
CLOUDSDK_CONFIG = "{{env.HOME}}/.config/gcloud-gcp-learning"

# Local runs use impersonation, with the same permissions as CI.
# CI does not use these tasks: there the SA comes from google-github-actions/auth

[tasks.plan]
description = "terragrunt plan for all stacks as terraform-plan"
env = { GOOGLE_IMPERSONATE_SERVICE_ACCOUNT = "terraform-plan@gcp-learning-bohdan88.iam.gserviceaccount.com" }
run = "terragrunt run --all plan"

[tasks.apply]
description = "terragrunt apply for all stacks as terraform-apply"
env = { GOOGLE_IMPERSONATE_SERVICE_ACCOUNT = "terraform-apply@gcp-learning-bohdan88.iam.gserviceaccount.com" }
run = "terragrunt run --all apply"

[tasks.format]
description = "Format HCL and terraform across the repo"
run = "terragrunt hcl format && terraform fmt -recursive"

[tasks.lint]
description = "Same checks as lint.yml: fmt, tflint, trivy"
run = [
  "terraform fmt -check -recursive -diff",
  "terragrunt hcl format --check --diff",
  "tflint --init --config {{config_root}}/.tflint.hcl",
  "tflint --recursive --config {{config_root}}/.tflint.hcl --format compact",
  "trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore .",
]
