# Обновления закреплённых по SHA actions: Dependabot сам находит новый
# релиз, подставляет его SHA и комментарий с версией и открывает PR.
# Каждый такой PR проходит lint и plan, как любое другое изменение.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Минорные и патч-обновления — одним PR, мажорные — отдельными
      actions-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
