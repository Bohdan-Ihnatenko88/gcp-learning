# Updates for SHA-pinned actions: Dependabot finds a new release, swaps in
# its commit SHA and version comment, and opens a PR.
# Each such PR goes through lint and plan like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates in one PR, majors in separate PRs
      actions-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
